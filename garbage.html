<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>黃色救援隊・英文垃圾分類</title><style>body{margin:0;font-family:system-ui;background:#fff3c0;text-align:center;color:#493508}header{background:#ffce33;padding:12px;font-weight:900;font-size:25px}.info{display:flex;justify-content:space-around;padding:12px;font-weight:bold}.hero{font-size:65px}.tip{font-size:21px;background:white;margin:8px;border-radius:14px;padding:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px}.item{background:white;border:3px solid #e5b52c;border-radius:15px;padding:12px 2px;font-size:29px;min-height:92px;touch-action:manipulation}.item small{display:block;font-size:17px;font-weight:800}.item span{display:block;font-size:15px}.msg{font-size:20px;min-height:35px;font-weight:bold}.btn{font-size:24px;background:#ffcf25;border:0;border-radius:18px;padding:13px 26px;font-weight:900;margin:12px}.hidden{display:none}#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center}#panel{background:white;border-radius:25px;padding:30px;margin:20px;font-size:26px}</style><header>🐶💛 黃色救援隊・垃圾車</header><div class="info"><span id="lvl"></span><span id="err"></span><span id="done"></span></div><div class="hero">🐶🚛♻️</div><div class="tip" id="tip"></div><div class="msg" id="msg"></div><div class="grid" id="grid"></div><div id="modal"><div id="panel"><div id="result"></div><button class="btn" id="again"></button></div></div><script>const vocab=[['🍎','apple'],['📦','box'],['🥫','can'],['🧷','diaper'],['🥚','eggshell'],['🍴','fork'],['🍇','grape'],['🎩','hat'],['🍦','ice cream'],['🫙','jar'],['🔑','key'],['🍋','lemon'],['🥛','milk carton'],['📰','newspaper'],['🍊','orange peel'],['📄','paper'],['👑','queen crown'],['🧸','rag doll'],['🧦','sock'],['🪥','toothbrush'],['☂️','umbrella'],['🏺','vase'],['💧','water bottle'],['🎹','xylophone'],['🧶','yarn'],['🤐','zip bag']];let level=1,wrong=0,idx=0,ordered=[];const $=s=>document.querySelector(s);function start(){wrong=0;idx=0;$('#modal').style.display='none';let count=Math.min(3+level,12);let pool=[...vocab].sort(()=>Math.random()-.5).slice(0,count).sort((a,b)=>a[1].localeCompare(b[1]));ordered=pool;let shown=[...pool].sort(()=>Math.random()-.5);$('#grid').innerHTML='';shown.forEach(([emoji,word])=>{let b=document.createElement('button');b.className='item';b.innerHTML=emoji+'<small>'+word+'</small><span>🔢 '+(word.charCodeAt(0)-96)+'</span>';b.onclick=()=>pick(b,word);$('#grid').appendChild(b)});update();$('#msg').textContent='看英文第一個字母，從 A 排到 Z！'}function update(){$('#lvl').textContent='第 '+level+' / 20 關';$('#err').textContent='❌ '+wrong+' / 3';$('#done').textContent='♻️ '+idx+' / '+ordered.length;$('#tip').textContent=idx<ordered.length?'下一個：找英文字母最前面的垃圾！ （A=1、B=2……Z=26）':'全部收好了！'}function finish(win){$('#modal').style.display='flex';$('#result').textContent=win?'🎉 垃圾收完了！':'😮 連續錯三次，垃圾車要重新出發！';$('#again').textContent=win?'➡️ 下一關':'🔄 再試一次';$('#again').onclick=()=>{if(win)level=level===20?1:level+1;start()}}function pick(b,word){if($('#modal').style.display==='flex')return;if(word!==ordered[idx][1]){wrong++;$('#msg').textContent='再看看第一個英文字母喔！';if(wrong>=3){update();finish(false);return}}else{wrong=0;b.disabled=true;b.style.opacity='.2';idx++;$('#msg').textContent='🐶 汪！收對了！';if(idx===ordered.length){update();finish(true);return}}update()}start()</script></html>
