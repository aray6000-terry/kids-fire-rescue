<!doctype html><html lang="zh-Hant"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>毛毛救火大作戰 20 關</title><style>*{box-sizing:border-box}body{margin:0;text-align:center;font-family:system-ui;background:#bcecff;color:#16334c}h1{font-size:clamp(23px,6vw,35px);margin:9px}#hud{font-size:22px;font-weight:800}#hint{font-size:20px;font-weight:800;margin:8px}#field{position:relative;margin:8px auto;border:5px solid white;border-radius:24px;overflow:hidden;width:min(96vw,850px);height:min(65vh,570px);touch-action:manipulation}#back{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(90px,24vw,220px);pointer-events:none}#dog{position:absolute;bottom:2%;left:2%;font-size:clamp(45px,10vw,75px);pointer-events:none}.fire{position:absolute;border:0;background:transparent;font-size:clamp(38px,9vw,65px);width:72px;height:85px;cursor:pointer}.fire small{display:block;background:white;border-radius:50%;border:3px solid orange;font-size:21px;width:34px;height:34px;line-height:28px;margin:auto;color:#222;font-weight:900}#splash{position:absolute;font-size:55px;display:none;pointer-events:none}#overlay{position:absolute;inset:0;background:#fff9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;font-size:26px;font-weight:bold}button.action{border:0;border-radius:18px;background:#ffce36;padding:15px 25px;font-size:25px;font-weight:900;cursor:pointer}#message{min-height:28px;font-size:19px;font-weight:700}#bottom{display:flex;justify-content:center;gap:12px}#bottom button{font-size:20px;border:0;border-radius:12px;padding:9px;background:white}</style><h1>🚒 毛毛救火大作戰 🐶</h1><div id="hud"></div><div id="hint"></div><div id="field"><div id="back"></div><div id="dog">🐶🚿</div><div id="splash">💦💦</div><div id="overlay"><div id="win"></div><button class="action" onclick="next()">➡️ 下一關</button></div></div><div id="message" aria-live="polite"></div><div id="bottom"><button onclick="start()">🔄 重玩這關</button><button onclick="next()">⏭️ 下一關</button></div><script>const scenes=[['🏠','小屋','#a8e5ff','#87cf73'],['🌳🏕️','森林','#a3e2ff','#61c777'],['🏫','學校','#a9e8ff','#d8bb80'],['🏭','工廠','#b9c4d6','#888'],['🏰','城堡','#d6c2ff','#85c978'],['🚂','火車站','#b0dfff','#9fbb8b'],['🚢','港口','#8edaff','#4b9acb'],['🏢','城市','#c7e6ff','#a5a5a5'],['🌋','火山','#ffc1a1','#b88160'],['🚀','太空基地','#6c6a9b','#555779']];let level=1,expected=1,total=0,remaining=0,answer=0,mode=0;const field=document.querySelector('#field'),hud=document.querySelector('#hud'),hint=document.querySelector('#hint'),msg=document.querySelector('#message'),overlay=document.querySelector('#overlay');function start(){document.querySelectorAll('.fire').forEach(x=>x.remove());overlay.style.display='none';msg.textContent='';expected=1;mode=(level-1)%3;total=Math.min(3+Math.floor((level-1)/2),9);remaining=total;let scene=scenes[(level-1)%scenes.length];field.style.background='linear-gradient('+scene[2]+' 65%,'+scene[3]+' 65%)';document.querySelector('#back').textContent=scene[0];hud.textContent='⭐ 第 '+level+' / 20 關｜'+scene[1];answer=1+Math.floor(Math.random()*4);hint.textContent=mode===0?'🔢 按照 1、2、3 的順序救火！':mode===1?'🎯 找到數字 '+answer+' 的火！':'➕ 數字加一：從 '+answer+' 開始往上找！';const nums=Array.from({length:total},(_,i)=>mode===0?i+1:mode===1?answer+i:answer+i);for(let i=nums.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}let slots=[];for(let i=0;i<total;i++){let col=i%3,row=Math.floor(i/3);slots.push([21+col*27+(Math.random()*6-3),9+row*26+(Math.random()*5-2)])}nums.forEach((n,i)=>{let f=document.createElement('button');f.className='fire';f.style.left=slots[i][0]+'%';f.style.top=slots[i][1]+'%';f.innerHTML='🔥<small>'+n+'</small>';f.setAttribute('aria-label','數字'+n+'的火');f.onclick=()=>hit(f,n);field.appendChild(f)});update()}function update(){document.querySelector('#message').textContent='💧 已滅 '+(total-remaining)+' / '+total+' 個火焰'}function hit(f,n){let target=mode===0?expected:answer+expected-1;if(n!==target){msg.textContent='🐶 再試試！找數字 '+target+'！';return}f.disabled=true;f.innerHTML='💦';expected++;remaining--;const s=document.querySelector('#splash');s.style.left=f.style.left;s.style.top=f.style.top;s.style.display='block';setTimeout(()=>s.style.display='none',250);setTimeout(()=>f.remove(),350);update();if(remaining===0){setTimeout(()=>{overlay.style.display='flex';document.querySelector('#win').textContent=level===20?'🏆 全部 20 關成功！':'🎉 救火成功！'},430)}}function next(){level=level===20?1:level+1;start()}start();</script></html>
