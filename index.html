<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>毛毛救火大作戰</title><style>body{margin:0;background:#bdeaff;font-family:system-ui;text-align:center;touch-action:manipulation}h1{font-size:clamp(25px,7vw,44px);margin:12px}#info{font-size:24px;font-weight:bold}#field{position:relative;height:65vh;overflow:hidden;background:linear-gradient(#a9e5ff 65%,#79c85c 65%);border:5px solid #fff;border-radius:22px;margin:8px}#house{font-size:min(45vw,230px);position:absolute;bottom:10%;left:50%;transform:translateX(-50%)}.fire{position:absolute;font-size:65px;border:0;background:transparent;cursor:pointer;animation:pulse .7s infinite alternate}#dog{position:absolute;bottom:0;left:3%;font-size:75px}#water{position:absolute;bottom:85px;left:75px;font-size:45px;pointer-events:none;display:none}button#again{font-size:24px;border:0;border-radius:15px;padding:12px 25px;background:#ffce3a}@keyframes pulse{to{transform:scale(1.2)}}</style><h1>🚒 毛毛救火大作戰 🐶</h1><div id="info">第 1 關｜救火 0 / 5</div><div id="field"><div id="house">🏠</div><div id="dog">🐶🚿</div><div id="water">💦💦💦</div></div><button id="again">重新開始 🔄</button><p>👆 點火焰，幫毛毛噴水救火！</p><script>let level=1,done=0,need=5;const field=document.querySelector('#field'),info=document.querySelector('#info'),water=document.querySelector('#water');function update(){info.textContent='第 '+level+' 關｜救火 '+done+' / '+need}function add(){const f=document.createElement('button');f.className='fire';f.textContent='🔥';f.style.left=(24+Math.random()*60)+'%';f.style.top=(10+Math.random()*52)+'%';f.onclick=()=>{f.disabled=true;water.style.display='block';water.style.left=f.style.left;water.style.top=f.style.top;setTimeout(()=>water.style.display='none',380);f.textContent='💦';setTimeout(()=>f.remove(),400);done++;update();if(done===need)setTimeout(()=>{alert('🎉 太棒了！毛毛成功救火！');level++;done=0;need=Math.min(5+level-1,10);start()},500)};field.appendChild(f)}function start(){document.querySelectorAll('.fire').forEach(x=>x.remove());update();for(let i=0;i<need;i++)add()}document.querySelector('#again').onclick=()=>{level=1;done=0;need=5;start()};start()</script></html>
