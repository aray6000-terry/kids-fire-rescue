<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>藍色警犬抓壞蛋</title><style>*{box-sizing:border-box}body{font-family:system-ui;text-align:center;margin:0;background:#d8f1ff;color:#15365a}h1{font-size:clamp(23px,6vw,35px);margin:9px}#hud{font-size:22px;font-weight:bold}#hint{font-size:21px;margin:9px;font-weight:bold}#field{position:relative;margin:8px auto;width:min(96vw,850px);height:min(66vh,590px);border:5px solid white;border-radius:24px;overflow:hidden;touch-action:manipulation}#bg{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(110px,25vw,220px);pointer-events:none}#hero{position:absolute;bottom:1%;left:2%;font-size:clamp(50px,12vw,85px);pointer-events:none}button.bad{position:absolute;font-size:clamp(35px,8vw,55px);background:transparent;border:0;width:66px;height:82px;cursor:pointer}button.bad small{display:block;margin:auto;width:39px;height:39px;border:3px solid #357ae8;border-radius:50%;background:white;color:#123;font-size:24px;font-weight:900;line-height:32px}#message{font-size:20px;font-weight:bold;min-height:32px}#overlay{position:absolute;inset:0;background:#ffffffc9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;font-size:27px;font-weight:bold}button.action{background:#ffda43;border:0;border-radius:18px;padding:15px 23px;font-size:26px;font-weight:900;cursor:pointer}#buttons{display:flex;gap:10px;justify-content:center}#buttons button{background:white;border:0;border-radius:14px;padding:10px 16px;font-size:20px}</style><h1>🐶🚓 藍色警犬抓壞蛋</h1><div id="hud"></div><div id="hint"></div><div id="field"><div id="bg"></div><div id="hero">🐶👮‍♂️🚓</div><div id="overlay"><div id="win">🎉 任務完成！</div><button class="action" onclick="next()">➡️ 下一關</button></div></div><div id="message" aria-live="polite"></div><div id="buttons"><button onclick="start()">🔄 重玩</button><button onclick="next()">⏭️ 下一關</button></div><script>const scenes=[['🏘️','小鎮','#9adfff','#8fc97c'],['🌲','森林','#9cddff','#6bc77a'],['🏫','學校','#b4e5ff','#c9b98d'],['🏰','城堡','#d6c9ff','#a1d282'],['🏖️','海灘','#8bdfff','#edda91'],['🚂','車站','#b0e3ff','#bbb'],['🏙️','城市','#b4ddff','#aaa'],['🚢','港口','#a8e2ff','#69b5da'],['⛰️','山谷','#9bdbff','#7dbb75'],['🚀','太空站','#555a96','#8a85b4']];let level=1,count=0,nextNumber=1,first=1;const field=document.querySelector('#field'),overlay=document.querySelector('#overlay'),msg=document.querySelector('#message');function start(){document.querySelectorAll('.bad').forEach(x=>x.remove());overlay.style.display='none';count=Math.min(6+Math.floor((level-1)/2),12);first=1+Math.floor((level-1)/5);nextNumber=first;let s=scenes[(level-1)%10];field.style.background='linear-gradient('+s[2]+' 65%,'+s[3]+' 65%)';document.querySelector('#bg').textContent=s[0];document.querySelector('#hud').textContent='⭐ 第 '+level+' / 20 關｜'+s[1];document.querySelector('#hint').textContent='🔢 先抓 '+first+'，再抓 '+(first+1)+'！';msg.textContent='🚓 已抓 0 / '+count+' 個壞蛋';let nums=Array.from({length:count},(_,i)=>first+i);for(let i=nums.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}nums.forEach((n,i)=>{let b=document.createElement('button');b.className='bad';let col=i%4,row=Math.floor(i/4);b.style.left=(3+col*23+Math.random()*3)+'%';b.style.top=(5+row*27+Math.random()*3)+'%';b.innerHTML='🥷<small>'+n+'</small>';b.setAttribute('aria-label','抓數字'+n+'的壞蛋');b.onclick=()=>catchBad(b,n);field.appendChild(b)})}function catchBad(b,n){if(n!==nextNumber){msg.textContent='🐶 找數字 '+nextNumber+'！';return}b.disabled=true;b.innerHTML='🚓';setTimeout(()=>b.remove(),400);nextNumber++;let caught=nextNumber-first;msg.textContent='👏 已抓 '+caught+' / '+count+' 個壞蛋';if(caught===count)setTimeout(()=>{overlay.style.display='flex';document.querySelector('#win').textContent=level===20?'🏆 20 關全部成功！':'🎉 全部抓到了！'},450)}function next(){level=level===20?1:level+1;start()}start();</script></html>
